---
- name: Install server binary
  ansible.builtin.copy:
    src: "{{ server_binary }}"
    dest: /usr/local/bin/platform-server
    mode: "0755"
    owner: root
    group: root
  notify:
    - Restart app process
    - Restart app systemd

- name: Render server config
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/platform/config.json
    owner: root
    group: platform
    mode: "0640"
  no_log: true
  notify:
    - Restart app process
    - Restart app systemd

- name: Install process runner
  ansible.builtin.copy:
    src: run-platform-server
    dest: /usr/local/bin/run-platform-server
    mode: "0755"
  notify: Restart app process

- name: Install systemd unit
  ansible.builtin.template:
    src: platform-server.service.j2
    dest: /etc/systemd/system/platform-server.service
    mode: "0644"
  notify: Restart app systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Check server status
  ansible.builtin.command: /usr/local/bin/run-platform-server status
  register: app_status
  changed_when: false
  failed_when: false
  when: platform_service_mgr == "process"

- name: Start server
  ansible.builtin.command: /usr/local/bin/run-platform-server start
  register: app_start
  changed_when: app_start.stdout == "started"
  when:
    - platform_service_mgr == "process"
    - app_status.rc != 0

- name: Enable server service
  ansible.builtin.systemd:
    name: platform-server
    enabled: true
    state: started
    daemon_reload: true
  when: platform_service_mgr == "systemd"
