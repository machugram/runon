name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Test Go
        run: go test ./...
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform validate
        run: |
          for env in dev prod; do
            terraform -chdir=infra/envs/$env init -backend=false
            terraform -chdir=infra/envs/$env validate
          done
      - name: Install ansible-lint
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ansible-lint
      - name: Install Ansible collections
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: .venv/bin/ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
      - name: Ansible lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: .venv/bin/ansible-lint ansible/playbooks/site.yml

  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Install Ansible
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ansible-core
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Smoke dev
        run: go run ./cmd/platform smoke -env dev
